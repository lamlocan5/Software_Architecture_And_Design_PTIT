<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healthcare Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">🏥</span>
          <span class="logo-text">HealthCare</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard"    class="nav-item active" data-page="dashboard">    <span class="nav-icon">📊</span><span>Dashboard</span></a>
        <a href="#patients"     class="nav-item"         data-page="patients">     <span class="nav-icon">👥</span><span>Bệnh nhân</span></a>
        <a href="#appointments" class="nav-item"         data-page="appointments"> <span class="nav-icon">📅</span><span>Lịch hẹn</span></a>
        <a href="#prescriptions"class="nav-item"         data-page="prescriptions"><span class="nav-icon">📋</span><span>Đơn thuốc</span></a>
        <a href="#bills"        class="nav-item"         data-page="bills">        <span class="nav-icon">🧾</span><span>Hóa đơn</span></a>
        <a href="#inventory"    class="nav-item"         data-page="inventory">    <span class="nav-icon">💊</span><span>Kho thuốc</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="service-status" id="serviceStatus">
          <div class="status-title">Trạng thái Services</div>
          <div class="status-item"><span class="dot" id="dot-patient"></span>Patient :8001</div>
          <div class="status-item"><span class="dot" id="dot-clinical"></span>Clinical :8002</div>
          <div class="status-item"><span class="dot" id="dot-billing"></span>Billing :8003</div>
          <div class="status-item"><span class="dot" id="dot-inventory"></span>Inventory :8004</div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()">☰</button>
          <div class="breadcrumb" id="breadcrumb">Dashboard</div>
        </div>
        <div class="topbar-right">
          <div class="time" id="clock"></div>
        </div>
      </header>
      <div class="content" id="content">
        <div class="loading-screen"><div class="spinner"></div><p>Đang tải...</p></div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal" id="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/patients.js"></script>
  <script src="js/clinical.js"></script>
  <script src="js/billing.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
