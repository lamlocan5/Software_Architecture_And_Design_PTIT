# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Limit request size
    client_max_body_size 10M;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Serving Frontend Static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serving Static assets cache
    location ~* \.(css|js|png|jpg|gif|ico|woff2)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # API Routing & Rate Limiting
    # 1. Patient Service
    location /api/v1/patients/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://patient-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Doctor Service
    location /api/v1/doctors/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://doctor-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Clinical Service (Appointments & Prescriptions)
    location /api/v1/appointments/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://clinical-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/prescriptions/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://clinical-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Billing Service
    location /api/v1/bills/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://billing-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Inventory Service (Medicines & Stock Transactions)
    location /api/v1/medicines/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://inventory-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/stock-transactions/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://inventory-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
