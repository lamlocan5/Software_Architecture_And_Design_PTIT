version: '3.9'

services:
  # ─── Databases ───────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
    ports:
      - "3307:3306"    # 3307 để tránh conflict với MySQL local
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456789"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ─── Services ────────────────────────────────────────────
  patient-service:
    build: ./patient-service
    ports:
      - "8001:8000"
    env_file: ./patient-service/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  clinical-service:
    build: ./clinical-service
    ports:
      - "8002:8000"
    env_file: ./clinical-service/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  billing-service:
    build: ./billing-service
    ports:
      - "8003:8000"
    env_file: ./billing-service/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  inventory-service:
    build: ./inventory-service
    ports:
      - "8004:8000"
    env_file: ./inventory-service/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  # ─── Frontend Dashboard ───────────────────────────────────
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/html:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - patient-service
      - clinical-service
      - billing-service
      - inventory-service
    restart: on-failure

volumes:
  mysql_data:
