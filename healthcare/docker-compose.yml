version: '3.9'

services:
  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ─── Services ────────────────────────────────────────────
  patient-service:
    build: ./patient-service
    expose:
      - "8000"
    env_file: ./patient-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: on-failure

  doctor-service:
    build: ./doctor-service
    expose:
      - "8000"
    env_file: ./doctor-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: on-failure

  clinical-service:
    build: ./clinical-service
    expose:
      - "8000"
    env_file: ./clinical-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: on-failure

  billing-service:
    build: ./billing-service
    expose:
      - "8000"
    env_file: ./billing-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: on-failure

  inventory-service:
    build: ./inventory-service
    expose:
      - "8000"
    env_file: ./inventory-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: on-failure

  # ─── Nginx API Gateway ────────────────────────────────────
  api-gateway:
    image: nginx:alpine
    container_name: healthcare-api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./frontend/html:/usr/share/nginx/html:ro
      - ./api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - patient-service
      - doctor-service
      - clinical-service
      - billing-service
      - inventory-service
    restart: on-failure
