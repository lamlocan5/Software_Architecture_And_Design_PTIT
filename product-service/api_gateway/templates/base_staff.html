{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore Admin — Quản lý kho</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{% static 'css/staff.css' %}">
</head>
<body>

<!-- ── LOGIN screen ──────────── -->
<!-- ── LOGIN screen ───────────────────────────────────────────────────────── -->
<div id="loginScreen" style="width:100%;display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(249,115,22,0.08) 0%, transparent 70%)">
    <div class="login-box">
        <div class="logo">🔐</div>
        <h2>Staff Portal</h2>
        <p>Đăng nhập để quản lý kho hàng</p>
        <input class="input-field" id="loginUser" type="text" placeholder="Tên đăng nhập" onkeydown="if(event.key==='Enter')login()">
        <input class="input-field" id="loginPass" type="password" placeholder="Mật khẩu" onkeydown="if(event.key==='Enter')login()">
        <button class="btn-login" onclick="login()">Đăng nhập →</button>
        <p style="text-align:center;margin-top:16px;font-size:0.8rem;color:var(--text-muted);">
            Chưa có tài khoản? Tạo qua API <code>/api/staff/register/</code>
        </p>
    </div>
</div>


<!-- ── DASHBOARD ─────────────── -->
<div id="appShell" style="display:none;width:100%;display:none;">
    {% include 'components/sidebar.html' %}

    <!-- Main Content -->
    <div class="main">
        {% block content %}{% endblock %}
    </div><!-- /main -->
</div><!-- /appShell -->

<div class="toast-wrap" id="toasts"></div>

<script>const STAFF_API = '{{ staff_service_url }}';</script>
<script src="{% static 'js/staff.js' %}"></script>
</body>
</html>
