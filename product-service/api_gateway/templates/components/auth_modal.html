    <!-- Auth Modal -->
    <div class="modal-overlay hidden" id="authModal" onclick="if(event.target===this)closeAuth()">
        <div class="modal">
            <button class="modal-close" onclick="closeAuth()">✕</button>
            <h2 id="authTitle">Chào mừng trở lại</h2>
            <p id="authSubtitle">Đăng nhập để mua sắm và quản lý giỏ hàng</p>
            <div class="tab-row">
                <button class="tab-item active" id="tabLogin" onclick="switchTab('login')">Đăng nhập</button>
                <button class="tab-item" id="tabRegister" onclick="switchTab('register')">Đăng ký</button>
            </div>
            <!-- Login Form -->
            <div id="loginForm">
                <div class="form-group">
                    <label class="form-label">Tên đăng nhập</label>
                    <input class="form-input" id="loginUsername" type="text" placeholder="Nhập tên đăng nhập...">
                </div>
                <div class="form-group">
                    <label class="form-label">Mật khẩu</label>
                    <input class="form-input" id="loginPassword" type="password" placeholder="Nhập mật khẩu...">
                </div>
                <button class="btn-primary" onclick="login()">Đăng nhập →</button>
            </div>
            <!-- Register Form -->
            <div id="registerForm" class="hidden">
                <div class="form-group">
                    <label class="form-label">Tên đăng nhập *</label>
                    <input class="form-input" id="regUsername" type="text" placeholder="Tên đăng nhập...">
                </div>
                <div class="form-group">
                    <label class="form-label">Email *</label>
                    <input class="form-input" id="regEmail" type="email" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Mật khẩu *</label>
                    <input class="form-input" id="regPassword" type="password" placeholder="Tối thiểu 6 ký tự...">
                </div>
                <div class="form-group">
                    <label class="form-label">Họ và tên</label>
                    <input class="form-input" id="regFullName" type="text" placeholder="Nguyễn Văn A...">
                </div>
                <button class="btn-primary" onclick="register()">Tạo tài khoản →</button>
            </div>
        </div>
    </div>
