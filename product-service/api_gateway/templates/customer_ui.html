{% extends 'base_customer.html' %}
{% load static %}

{% block content %}
    <!-- Hero -->
    <section class="hero">
        <h1>Mua sắm công nghệ<br>thông minh hơn</h1>
        <p>Laptop & điện thoại chính hãng, giá tốt nhất thị trường</p>
        <div class="search-bar">
            <input class="search-input" id="searchInput" type="text"
                placeholder="🔍  Tìm kiếm laptop, mobile, RAM, CPU..." onkeyup="if(event.key==='Enter') search()">
            <button class="search-btn" onclick="search()">→</button>
        </div>
    </section>

    <!-- Filter pills -->
    <div class="filter-bar">
        <div class="pill active" id="pillAll" onclick="filterProducts('all')">Tất cả sản phẩm</div>
        <div class="pill" id="pillLaptop" onclick="filterProducts('laptop')">💻 Laptop</div>
        <div class="pill" id="pillMobile" onclick="filterProducts('mobile')">📱 Mobile</div>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="section-header">
            <h2 class="section-title" id="sectionTitle">Tất cả sản phẩm</h2>
            <span class="product-count" id="productCount"></span>
        </div>
        <div class="product-grid" id="productGrid">
            <div class="loading-state">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </div>


{% endblock %}
