<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microservices E-commerce</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 30px; }
        .links { display: flex; gap: 20px; justify-content: center; }
        a { text-decoration: none; padding: 15px 30px; border-radius: 5px; color: white; font-weight: bold; transition: opacity 0.3s; }
        a:hover { opacity: 0.8; }
        .btn-staff { background-color: #e74c3c; }
        .btn-customer { background-color: #3498db; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Microservices E-commerce</h1>
        <div class="links">
            <a href="/ui/staff/" class="btn-staff">Staff UI</a>
            <a href="/ui/customer/" class="btn-customer">Customer UI</a>
        </div>
        <p style="margin-top:28px;color:#555;font-size:15px;max-width:420px;margin-left:auto;margin-right:auto;line-height:1.5;">
            Trong <strong>Customer UI</strong>, mở chat tư vấn <strong>RAG</strong> bằng nút tròn 💬 góc phải màn hình.
        </p>
    </div>
</body>
</html>
