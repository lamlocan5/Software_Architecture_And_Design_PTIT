{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="form-container" style="max-width: 600px;">
        <h2 style="margin-bottom: 2rem;">Checkout</h2>

        <div style="margin-bottom: 2rem; padding: 1rem; background: #f3f4f6; border-radius: var(--radius);">
            <h3>Order Summary</h3>
            <p>Total Items: {{ cart.items.count }}</p>
            <p style="font-size: 1.2rem; font-weight: bold; color: var(--primary-color);">Total: ${{ cart.total_price }}
            </p>
        </div>

        <form method="post">
            {% csrf_token %}
            <h3 style="margin-bottom: 1rem;">Shipping Information</h3>

            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" class="form-control" required>
            </div>

            <button type="submit" class="btn-primary btn-block">Place Order</button>
        </form>
    </div>
</div>
{% endblock %}
