{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 500px; margin-top: 3rem;">
    <div class="card">
        <div class="card-body" style="text-align: center;">
            <h2 style="margin-bottom: 2rem;">Payment</h2>
            <p>Order Total:
                <strong
                    style="color: var(--primary-color); font-size: 1.5rem;">${{order.total_amount|floatformat:2}}</strong>
            </p>

            <div style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 2rem;">
                <p style="margin-bottom: 1rem;">Select Payment Method:</p>

                <form method="post">
                    {% csrf_token %}
                    <div style="margin-bottom: 1rem;">
                        <label
                            style="display: block; padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer;">
                            <input type="radio" name="method" value="COD" checked> Cash on Delivery (COD)
                        </label>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label
                            style="display: block; padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; opacity: 0.6;">
                            <input type="radio" name="method" value="CC" disabled> Credit Card (Coming Soon)
                        </label>
                    </div>

                    <button type="submit" class="btn-primary btn-block">Confirm Payment</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
