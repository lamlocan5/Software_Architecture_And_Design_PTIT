{% extends "store/base.html" %}
{% block title %}Order success – Bookstore{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-12">
    <div class="bg-white rounded-xl shadow border border-gray-100 p-8">
        <div class="text-5xl mb-4">✅</div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Order placed successfully</h1>
        <p class="text-gray-600 mb-6">Thank you for your order. We'll process it and ship soon.</p>
        <a href="{% url 'store:product_list' %}" class="inline-block bg-amber-500 text-slate-900 px-6 py-2 rounded-lg font-medium hover:bg-amber-400 transition">Continue shopping</a>
    </div>
</div>
{% endblock %}
