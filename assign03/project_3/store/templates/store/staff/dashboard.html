{% extends "store/base.html" %}
{% block title %}Staff Dashboard – Bookstore{% endblock %}
{% block content %}
<div class="bg-white rounded-xl shadow border border-gray-100 p-6">
    <h1 class="text-2xl font-bold text-slate-800 mb-6">Staff Dashboard</h1>
    <div class="flex flex-wrap gap-4">
        <a href="{% url 'staff:book_add' %}" class="inline-flex items-center gap-2 bg-amber-500 text-slate-900 px-4 py-2 rounded-lg font-medium hover:bg-amber-400 transition">
            ➕ Add new book
        </a>
        <a href="{% url 'store:product_list' %}" class="inline-flex items-center gap-2 bg-slate-200 text-slate-800 px-4 py-2 rounded-lg font-medium hover:bg-slate-300 transition">
            📚 View catalog
        </a>
    </div>
</div>
{% endblock %}
