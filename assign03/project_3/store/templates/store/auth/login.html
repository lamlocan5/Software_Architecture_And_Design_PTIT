{% extends "store/base.html" %}
{% block title %}Login – Bookstore{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="bg-white rounded-2xl shadow-lg p-8 border border-gray-100">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Sign in</h1>
        <form method="post" action="{% url 'auth:login' %}" class="space-y-4">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="text-red-600 text-sm">{{ form.non_field_errors }}</div>
            {% endif %}
            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                {{ form.username }}
            </div>
            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                {{ form.password }}
            </div>
            <button type="submit" class="w-full bg-slate-800 text-white py-2.5 rounded-lg font-medium hover:bg-slate-700 transition">
                Log in
            </button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">
            Don't have an account? <a href="{% url 'auth:register' %}" class="text-amber-600 font-medium hover:underline">Register</a>
        </p>
    </div>
</div>
{% endblock %}
