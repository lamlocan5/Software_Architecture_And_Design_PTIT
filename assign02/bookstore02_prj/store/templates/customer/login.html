{% extends 'base.html' %}

{% block title %}Đăng nhập - Bookstore{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 3rem auto; padding: 2rem; border: 1px solid #ddd; border-radius: 8px;">
    <h1 style="text-align: center; margin-bottom: 2rem;">Đăng nhập</h1>

    <form method="POST">
        {% csrf_token %}

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Username</label>
            <input type="text" name="username" required
                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Password</label>
            <input type="password" name="password" required
                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <button type="submit"
            style="width: 100%; padding: 1rem; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">Đăng
            nhập</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem;">
        Chưa có tài khoản? <a href="{% url 'customer_register' %}" style="color: #007bff;">Đăng ký</a>
    </p>
</div>
{% endblock %}
