{% extends 'base.html' %}

{% block title %}Đăng ký - Bookstore{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 3rem auto; padding: 2rem; border: 1px solid #ddd; border-radius: 8px;">
    <h1 style="text-align: center; margin-bottom: 2rem;">Đăng ký tài khoản</h1>

    <form method="POST">
        {% csrf_token %}

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Username</label>
            <input type="text" name="username" required
                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Email</label>
            <input type="email" name="email" required
                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Họ tên</label>
            <input type="text" name="full_name" required
                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Số điện thoại</label>
            <input type="tel" name="phone"
                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Password</label>
            <input type="password" name="password" required
                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Xác nhận password</label>
            <input type="password" name="confirm_password" required
                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <button type="submit"
            style="width: 100%; padding: 1rem; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">Đăng
            ký</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem;">
        Đã có tài khoản? <a href="{% url 'customer_login' %}" style="color: #007bff;">Đăng nhập</a>
    </p>
</div>
{% endblock %}
