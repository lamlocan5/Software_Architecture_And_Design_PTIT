{% extends 'base.html' %}

{% block title %}Staff Login - Bookstore{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 3rem auto; padding: 2rem; border: 1px solid #ddd; border-radius: 8px;">
    <h1 style="text-align: center; margin-bottom: 2rem;">🔐 Staff Login</h1>

    <form method="POST">
        {% csrf_token %}

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Username</label>
            <input type="text" name="username" required
                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Password</label>
            <input type="password" name="password" required
                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <button type="submit"
            style="width: 100%; padding: 1rem; background: #dc3545; color: white; border: none; border-radius: 4px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">Login</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; color: #666;">
        <small>For staff members only</small>
    </p>
</div>
{% endblock %}
