global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']

  - job_name: 'frontend'
    static_configs:
      - targets: ['frontend:8000']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8000']
