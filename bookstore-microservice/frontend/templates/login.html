<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .form-control {
            border-radius: 10px;
            border: 1.5px solid #dee2e6;
            padding: 0.7rem 1rem;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.12);
        }
        .btn-login {
            border-radius: 10px;
            padding: 0.7rem;
            font-weight: 600;
            font-size: 1rem;
        }
        .demo-box {
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px dashed #dee2e6;
        }
    </style>
</head>
<body>
<div class="container px-3">
    <div class="auth-card card mx-auto">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div style="font-size: 3rem; line-height: 1;" class="mb-2">📚</div>
                <h3 class="fw-bold mb-0">Bookstore</h3>
                <p class="text-muted small">Microservice Demo</p>
            </div>

            <h5 class="fw-semibold mb-3">Đăng nhập</h5>

            {% if error %}
            <div class="alert alert-danger py-2">
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted text-uppercase">Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="Tên đăng nhập" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold small text-muted text-uppercase">Mật khẩu</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-login">Đăng nhập</button>
            </form>

            <hr class="my-3">

            <div class="demo-box p-3 mb-3">
                <p class="fw-semibold small mb-2 text-muted text-uppercase">Tài khoản demo</p>
                <div class="row g-2">
                    <div class="col-6">
                        <div class="bg-white rounded p-2 text-center border">
                            <span class="badge bg-danger mb-1">Admin</span>
                            <p class="mb-0 small"><code>admin</code></p>
                            <p class="mb-0 small text-muted"><code>admin123</code></p>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="bg-white rounded p-2 text-center border">
                            <span class="badge bg-primary mb-1">User</span>
                            <p class="mb-0 small">Tự đăng ký</p>
                            <p class="mb-0 small text-muted">bên dưới →</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center">
                <span class="text-muted small">Chưa có tài khoản?</span>
                <a href="/register/" class="fw-semibold text-decoration-none ms-1">Đăng ký ngay</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
