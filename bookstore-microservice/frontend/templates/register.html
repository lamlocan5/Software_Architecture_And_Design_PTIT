<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký — OnlineStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .form-control {
            border-radius: 10px;
            border: 1.5px solid #dee2e6;
            padding: 0.7rem 1rem;
        }
        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 3px rgba(25,135,84,0.12);
        }
        .btn-register {
            border-radius: 10px;
            padding: 0.7rem;
            font-weight: 600;
            font-size: 1rem;
        }
    </style>
</head>
<body>
<div class="container px-3 py-4">
    <div class="auth-card card mx-auto">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div style="font-size: 2.5rem; line-height: 1;" class="mb-2">🛍️</div>
                <h3 class="fw-bold mb-0">OnlineStore</h3>
                <p class="text-muted small">Tạo tài khoản mới</p>
            </div>

            {% if error %}
            <div class="alert alert-danger py-2">
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted text-uppercase">Họ và tên</label>
                    <input type="text" name="name" class="form-control"
                           placeholder="Nguyễn Văn A" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted text-uppercase">Email</label>
                    <input type="email" name="email" class="form-control"
                           placeholder="your@email.com" required>
                    <div class="form-text">Email dùng làm tên đăng nhập</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted text-uppercase">Mật khẩu</label>
                    <input type="password" name="password1" class="form-control"
                           placeholder="Tối thiểu 6 ký tự" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold small text-muted text-uppercase">Xác nhận mật khẩu</label>
                    <input type="password" name="password2" class="form-control"
                           placeholder="Nhập lại mật khẩu" required>
                </div>

                <button type="submit" class="btn btn-success w-100 btn-register mb-3">Tạo tài khoản</button>
            </form>

            <div class="bg-light rounded-3 p-3 mb-3">
                <p class="fw-semibold small mb-2 text-muted text-uppercase">Khi đăng ký bạn sẽ có</p>
                <ul class="mb-0 ps-3 small text-secondary">
                    <li>Giỏ hàng cá nhân tự động tạo</li>
                    <li>Đặt hàng và theo dõi đơn hàng</li>
                    <li>Viết đánh giá sách</li>
                </ul>
            </div>

            <div class="text-center">
                <span class="text-muted small">Đã có tài khoản?</span>
                <a href="/login/" class="fw-semibold text-decoration-none ms-1">Đăng nhập</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
