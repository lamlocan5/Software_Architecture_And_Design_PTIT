name: Cart Service CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "cart-service/**"
      - ".github/workflows/cart-service-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "cart-service/**"

env:
  IMAGE_NAME: cart-service
  DOCKER_REGISTRY: ghcr.io
  IMAGE_FULL: ghcr.io/${{ github.repository_owner }}/cart-service

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cart-service

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: cart-service/requirements.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-django

      - name: 🔍 Lint with flake8
        run: |
          # Fail on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues (max line length 120)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: 🗃️ Run Django migrations (SQLite in-memory)
        run: |
          python manage.py makemigrations app
          python manage.py migrate

      - name: ✅ Run tests
        run: |
          python manage.py test app --verbosity=2
        env:
          DJANGO_SETTINGS_MODULE: cart_service.settings
          PYTHONPATH: .

  # ─────────────────────────────────────────────
  # JOB 2: Build & Push Docker Image
  # ─────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    # Only push image on pushes to main/develop (not PRs)
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FULL }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./cart-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 3: Deploy (chỉ khi push vào main)
  # ─────────────────────────────────────────────
  deploy:
    name: 🚢 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: 🚀 Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd /opt/bookstore-microservice
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_FULL }}:latest
            docker compose up -d --no-deps cart-service
            docker image prune -f
          EOF

      - name: 🏥 Health check
        run: |
          sleep 10
          curl --fail http://${{ secrets.DEPLOY_HOST }}:8003/carts/ || echo "Health check returned non-200 (may be normal for POST-only endpoint)"
