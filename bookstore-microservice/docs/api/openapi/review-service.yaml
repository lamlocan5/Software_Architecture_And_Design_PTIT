openapi: 3.0.3
info:
  title: Review Service API
  version: 1.0.0
  description: Đánh giá sách và thống kê rating.
servers:
  - url: http://review-service:8000
paths:
  /reviews/:
    get:
      summary: Danh sách tất cả đánh giá
      tags: [Reviews]
      responses:
        '200':
          description: OK
    post:
      summary: Tạo đánh giá mới cho sách
      tags: [Reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
      responses:
        '201':
          description: Created
  /reviews/book/{book_id}/:
    get:
      summary: Danh sách đánh giá cho 1 cuốn sách
      tags: [Reviews]
      parameters:
        - in: path
          name: book_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /reviews/stats/{book_id}/:
    get:
      summary: Thống kê rating cho 1 cuốn sách
      tags: [Reviews]
      parameters:
        - in: path
          name: book_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  book_id:
                    type: integer
                  avg_rating:
                    type: number
                  total_reviews:
                    type: integer

components:
  schemas:
    Review:
      type: object
      properties:
        id:
          type: integer
        book_id:
          type: integer
        customer_id:
          type: integer
        customer_name:
          type: string
        book_title:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        created_at:
          type: string
          format: date-time
      required: [book_id, customer_id, rating]

