    }

    # Route for AI Service - recommend
    location /api/recommend {
        limit_req zone=api_limit burst=20 nodelay;
        rewrite ^/api/recommend(?:/(.*))?$ /recommend/$1 break;
        proxy_pass http://ai-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route for AI Service - chatbot
    location /api/chatbot {
        limit_req zone=api_limit burst=20 nodelay;
        rewrite ^/api/chatbot(?:/(.*))?$ /chatbot/$1 break;
        proxy_pass http://ai-service:8000;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route for BFF API Gateway / Orchestration
    location /api/gateway {
        limit_req zone=api_limit burst=20 nodelay;

        # Clean/Reset headers to avoid client spoofing
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Email "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-User-Profile-Id "";
        proxy_set_header X-User-Superuser "";
        proxy_set_header X-User-Username "";

        auth_request /api/auth/verify;

        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_email $upstream_http_x_user_email;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $user_profile_id $upstream_http_x_user_profile_id;
        auth_request_set $user_superuser $upstream_http_x_user_superuser;
        auth_request_set $user_username $upstream_http_x_user_username;

        proxy_pass http://api-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject downstream user headers
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Email $user_email;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-User-Profile-Id $user_profile_id;
        proxy_set_header X-User-Superuser $user_superuser;
        proxy_set_header X-User-Username $user_username;
    }

    # Route for Notification Service
    location /api/notifications {
        limit_req zone=api_limit burst=20 nodelay;

        # Clean/Reset headers to avoid client spoofing
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Email "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-User-Profile-Id "";
        proxy_set_header X-User-Superuser "";
        proxy_set_header X-User-Username "";

        auth_request /api/auth/verify;

        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_email $upstream_http_x_user_email;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $user_profile_id $upstream_http_x_user_profile_id;
        auth_request_set $user_superuser $upstream_http_x_user_superuser;
        auth_request_set $user_username $upstream_http_x_user_username;

        rewrite ^/api/notifications(?:/(.*))?$ /notifications/$1 break;
        proxy_pass http://notification-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject downstream user headers
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Email $user_email;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-User-Profile-Id $user_profile_id;
        proxy_set_header X-User-Superuser $user_superuser;
        proxy_set_header X-User-Username $user_username;
    }

    # Internal Authentication Verification Endpoint
    location = /api/auth/verify {
        internal;
        proxy_pass http://user-service:8000/api/auth/verify/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # Map cookies or headers to Authorization
        set $auth_header "";
        if ($cookie_access_token) {
            set $auth_header "Bearer $cookie_access_token";
        }
        if ($http_authorization) {
            set $auth_header $http_authorization;
        }
        proxy_set_header Authorization $auth_header;
        proxy_set_header X-Original-URI $request_uri;
    }

    location / {
        # Apply Rate Limiting: burst capacity of 20 requests, delay requests exceeding rate limit
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://frontend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
