{% extends 'frontend/base.html' %}
{% block content %}

<!-- Page Header -->
<div class="manage-header animate-fade-up">
    <div>
        <h1 style="font-size:2rem;font-weight:800;margin-bottom:.3rem;">Manage Products</h1>
        <p class="text-muted text-sm">Add, edit or remove laptop and mobile products</p>
    </div>
    <button class="btn btn-primary" onclick="openAddModal()" id="addProductBtn">
        + Add New Product
    </button>
</div>

<!-- Products Table -->
<div class="glass animate-fade-up" style="padding:0;overflow:hidden;animation-delay:0.1s;">
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Model Name</th>
                    <th>Specs</th>
                    <th>Price</th>
                    <th style="text-align:right;">Actions</th>
                </tr>
            </thead>
            <tbody id="adminProductList">
                <tr>
                    <td colspan="6" style="padding:3rem;text-align:center;color:var(--text-muted);">
                        <span style="font-size:1.5rem;display:block;margin-bottom:.75rem;">⏳</span>
                        Loading products…
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeAddModal()"></div>
<div class="modal glass-elevated" id="addModal">
    <div class="modal-header">
        <h2 id="modalTitle" style="font-size:1.4rem;font-weight:800;">Add Product</h2>
        <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <form id="addProductForm" data-mode="add" data-edit-id="">
        <div class="form-group">
            <label>Product Type</label>
            <select id="prod-type" class="form-input" required onchange="toggleFields()">
                <option value="laptop">💻 Laptop</option>
                <option value="mobile">📱 Mobile</option>
            </select>
        </div>
        <div class="form-group">
            <label>Model Name</label>
            <input type="text" id="prod-name" class="form-input" required placeholder="e.g. MacBook Pro 14">
        </div>
        <div class="form-group">
            <label>Price (USD)</label>
            <input type="number" step="0.01" id="prod-price" class="form-input" required placeholder="0.00">
        </div>

        <!-- Laptop-specific -->
        <div id="laptop-fields">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group">
                    <label>CPU</label>
                    <input type="text" id="prod-cpu" class="form-input" placeholder="Intel Core i7…">
                </div>
                <div class="form-group">
                    <label>RAM (GB)</label>
                    <input type="number" id="prod-ram" class="form-input" placeholder="16">
                </div>
            </div>
        </div>

        <!-- Mobile-specific -->
        <div id="mobile-fields" style="display:none;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group">
                    <label>Chipset</label>
                    <input type="text" id="prod-chipset" class="form-input" placeholder="Snapdragon 8…">
                </div>
                <div class="form-group">
                    <label>Storage (GB)</label>
                    <input type="number" id="prod-storage" class="form-input" placeholder="256">
                </div>
            </div>
        </div>

        <div style="display:flex;gap:1rem;margin-top:2rem;">
            <button type="button" class="btn btn-secondary" onclick="closeAddModal()" style="flex:1;">Cancel</button>
            <button type="submit" class="btn btn-primary" style="flex:2;" id="modalSubmitBtn">Save Product</button>
        </div>
    </form>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) {
        showToast('Please login as staff', 'error');
        setTimeout(() => window.location.href = '/staff-login/', 1000);
    }

    let globalProducts = [];

    async function loadAdminProducts() {
        try {
            const [laptopRes, mobileRes] = await Promise.all([
                fetch('/api/laptop/products/'),
                fetch('/api/moblie/products/')
            ]);
            const laptopsData = await laptopRes.json();
            const mobilesData = await mobileRes.json();

            const laptops = (laptopsData.items || []).map(p => ({...p, type: 'laptop'}));
            const mobiles = (mobilesData.items || []).map(p => ({...p, type: 'mobile'}));
            const allProducts = [...laptops, ...mobiles].sort((a, b) => b.id - a.id);
            globalProducts = allProducts;

            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            let filtered = allProducts;
            if (query) {
                const q = query.toLowerCase();
                filtered = allProducts.filter(p =>
                    p.model_name.toLowerCase().includes(q) ||
                    (p.cpu && p.cpu.toLowerCase().includes(q)) ||
                    (p.chipset && p.chipset.toLowerCase().includes(q))
                );
            }

            const container = document.getElementById('adminProductList');
            if (!filtered.length) {
                container.innerHTML = '<tr><td colspan="6" style="padding:3rem;text-align:center;color:var(--text-muted);">No products matched your search.</td></tr>';
                return;
            }

            container.innerHTML = filtered.map(p => `
                <tr>
                    <td style="color:var(--text-muted);font-size:0.82rem;">#${p.id}</td>
                    <td>
                        <span class="product-type-badge ${p.type === 'laptop' ? 'badge-laptop' : 'badge-mobile'}">
                            ${p.type === 'laptop' ? '💻' : '📱'} ${p.type}
                        </span>
                    </td>
                    <td style="font-weight:600;">${p.model_name}</td>
                    <td class="text-muted text-sm" style="line-height:1.6;">
                        ${p.type === 'laptop'
                            ? `CPU: ${p.cpu}<br>RAM: ${p.ram_gb} GB`
                            : `Chip: ${p.chipset}<br>Storage: ${p.storage_gb} GB`}
                    </td>
                    <td style="font-weight:700;color:var(--accent);">$${parseFloat(p.price).toFixed(2)}</td>
                    <td style="text-align:right;">
                        <button class="btn btn-sm" style="background:rgba(56,189,248,0.1);color:#38bdf8;border:1px solid rgba(56,189,248,0.2);margin-right:.5rem;" onclick="openEditModal(${p.id})">Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id},'${p.type}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        } catch (err) {
            document.getElementById('adminProductList').innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--error);padding:2rem;">Failed to load products</td></tr>';
        }
    }

    function openAddModal() {
        document.getElementById('modalOverlay').style.display = 'block';
        const m = document.getElementById('addModal');
        m.style.display = 'block';
        requestAnimationFrame(() => m.classList.add('open'));
    }

    function closeAddModal() {
        const m = document.getElementById('addModal');
        m.classList.remove('open');
        setTimeout(() => {
            document.getElementById('modalOverlay').style.display = 'none';
            m.style.display = 'none';
            const form = document.getElementById('addProductForm');
            form.reset();
            form.dataset.mode = 'add';
            form.dataset.editId = '';
            document.getElementById('modalTitle').textContent = 'Add Product';
            document.getElementById('prod-type').disabled = false;
            document.getElementById('modalSubmitBtn').textContent = 'Save Product';
            toggleFields();
        }, 300);
    }

    function openEditModal(id) {
        const p = globalProducts.find(x => x.id === id);
        if (!p) return;
        const form = document.getElementById('addProductForm');
        form.dataset.mode = 'edit';
        form.dataset.editId = id;
        document.getElementById('modalTitle').textContent = 'Edit Product';
        document.getElementById('modalSubmitBtn').textContent = 'Update Product';
        document.getElementById('prod-type').value = p.type;
        document.getElementById('prod-type').disabled = true;
        document.getElementById('prod-name').value = p.model_name;
        document.getElementById('prod-price').value = p.price;
        toggleFields();
        if (p.type === 'laptop') {
            document.getElementById('prod-cpu').value = p.cpu || '';
            document.getElementById('prod-ram').value = p.ram_gb || '';
        } else {
            document.getElementById('prod-chipset').value = p.chipset || '';
            document.getElementById('prod-storage').value = p.storage_gb || '';
        }
        openAddModal();
    }

    function toggleFields() {
        const type = document.getElementById('prod-type').value;
        document.getElementById('laptop-fields').style.display = type === 'laptop' ? 'block' : 'none';
        document.getElementById('mobile-fields').style.display = type === 'mobile' ? 'block' : 'none';
    }

    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const mode = form.dataset.mode || 'add';
        const editId = form.dataset.editId;
        const type = document.getElementById('prod-type').value;
        const btn = document.getElementById('modalSubmitBtn');
        btn.textContent = 'Saving…';
        btn.disabled = true;

        const payload = {
            model_name: document.getElementById('prod-name').value,
            price: document.getElementById('prod-price').value
        };
        if (type === 'laptop') {
            payload.cpu = document.getElementById('prod-cpu').value;
            payload.ram_gb = document.getElementById('prod-ram').value;
        } else {
            payload.chipset = document.getElementById('prod-chipset').value;
            payload.storage_gb = document.getElementById('prod-storage').value;
        }

        try {
            let endpoint = type === 'laptop' ? '/api/laptop/products/' : '/api/moblie/products/';
            let method = 'POST';
            if (mode === 'edit') { endpoint += `${editId}/update/`; method = 'PUT'; }
            else                 { endpoint += 'create/'; }

            const res = await fetch(endpoint, {
                method,
                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                showToast(mode === 'edit' ? 'Product updated!' : 'Product added!', 'success');
                closeAddModal();
                loadAdminProducts();
            } else {
                showToast('Failed to save product', 'error');
                btn.textContent = 'Save Product';
                btn.disabled = false;
            }
        } catch (err) {
            showToast('Network error', 'error');
            btn.textContent = 'Save Product';
            btn.disabled = false;
        }
    });

    async function deleteProduct(id, type) {
        if (!confirm('Are you sure you want to delete this product?')) return;
        try {
            const endpoint = type === 'laptop'
                ? `/api/laptop/products/${id}/delete/`
                : `/api/moblie/products/${id}/delete/`;
            const res = await fetch(endpoint, {
                method: 'DELETE',
                headers: {'Authorization': `Bearer ${token}`}
            });
            if (res.ok) {
                showToast('Product deleted', 'info');
                loadAdminProducts();
            } else {
                showToast('Failed to delete product', 'error');
            }
        } catch (err) {
            showToast('Network error', 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', loadAdminProducts);
</script>
{% endblock %}
