{% extends 'frontend/base.html' %}
{% block content %}
<div class="dashboard glass" style="padding: 2rem;">
    <h1>Staff Dashboard</h1>
    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
        <div class="glass" style="flex: 1; padding: 1.5rem; text-align: center;">
            <h3 style="color: var(--text-muted);">Total Sales</h3>
            <p style="font-size: 2rem; font-weight: bold; color: var(--accent);">$10,240</p>
        </div>
        <div class="glass" style="flex: 1; padding: 1.5rem; text-align: center;">
            <h3 style="color: var(--text-muted);">Active Orders</h3>
            <p style="font-size: 2rem; font-weight: bold; color: var(--accent);">24</p>
        </div>
    </div>
    <div style="margin-top: 2rem; display: flex; gap: 1rem;">
        <a href="/staff/products/" class="btn btn-primary">Manage Products</a>
        <a href="/staff/orders/" class="btn btn-primary">Manage Orders</a>
    </div>
</div>
{% endblock %}
