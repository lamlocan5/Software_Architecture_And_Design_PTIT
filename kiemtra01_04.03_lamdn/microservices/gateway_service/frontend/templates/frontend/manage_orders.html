{% extends 'frontend/base.html' %}
{% block content %}
<div class="manage-orders glass" style="padding: 2rem;">
    <h1>Manage Orders</h1>
    <table style="width: 100%; border-collapse: separate; border-spacing: 0 0.5rem; text-align: left; margin-top: 2rem;">
        <thead>
            <tr style="color: var(--text-muted);">
                <th style="padding: 1rem;">Order ID</th>
                <th style="padding: 1rem;">Customer</th>
                <th style="padding: 1rem;">Status</th>
                <th style="padding: 1rem;">Actions</th>
            </tr>
        </thead>
        <tbody id="adminOrderList">
            <tr class="glass">
                <td colspan="4" style="padding: 1rem; text-align: center;">Loading orders...</td>
            </tr>
        </tbody>
    </table>
</div>
{% endblock %}
