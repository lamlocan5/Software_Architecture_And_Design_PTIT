<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_MALL :: AI_TERMINAL</title>
  <meta name="description" content="Chatbot AI tư vấn mua sắm - Cyberpunk Terminal">
  <link rel="stylesheet" href="css/style_v2.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="cyber-nav">
  <a href="index_v2.html" class="brand">
    CYBER<span>MALL</span>
  </a>
  
  <div class="nav-links">
    <a href="index_v2.html" class="nav-link">MALL_DFS</a>
    <a href="chat_v2.html" class="nav-link active">AI_ASSIST</a>
  </div>

  <div class="user-status">
    <span class="text-cyan font-mono" style="font-size: 0.8rem;">UID::</span>
    <input type="number" id="globalUserId" value="1" min="1" max="500">
  </div>
</nav>

<div class="chat-layout">
  
  <!-- Left: Target Chat Terminal -->
  <main class="chat-main">
    <div class="terminal-header">
      <div class="terminal-title">
        <span class="terminal-status"></span>
        <span>SYS.NEURAL_ORACLE.exe // RAG_PROTOCOL_v2.0</span>
      </div>
      <div>
         <button class="cyber-btn btn-secondary" onclick="clearChat()">[ RST_BUFFER ]</button>
      </div>
    </div>

    <div class="chat-history" id="chatMessages">
      <div class="msg-line msg-ai">
        <span class="text-primary font-mono" style="font-weight:800; display:block; margin-bottom:8px;">[ INIT_SEQ_COMPLETE ]</span>
        CONNECTION_ESTABLISHED. I AM THE CYBER_ORACLE.<br>
        ACCESSING MYSQL_DB AND NEO4J_GRAPH VIA ENCRYPTED_LINK...<br><br>
        <span class="text-muted">AWAITING_QUERY_INPUT...</span>
      </div>
    </div>

    <div class="chat-input-area">
      <span class="text-pink">CYBER_USER></span>
      <textarea class="chat-textarea" id="chatInput" rows="1" placeholder="_type_your_command_here" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
      <button class="cyber-btn" id="sendBtn" onclick="sendMessage()">[ EXEC ]</button>
    </div>
  </main>
  
  <!-- Right: Sidebar & Quick Tools -->
  <aside class="chat-sidebar">
    
    <div class="bento-chat-box">
      <h3>// QUICK_INJECTIONS</h3>
      <div class="quick-prompts-list">
        <button class="cyber-btn" onclick="sendQuickPrompt(this)">[ ANALYZE_TOP_TRENDS ]</button>
        <button class="cyber-btn" onclick="sendQuickPrompt(this)">[ PUSH_USER_SUGGESTIONS ]</button>
        <button class="cyber-btn" onclick="sendQuickPrompt(this)">[ FETCH_SIMILAR_ID:15 ]</button>
      </div>
    </div>

    <div class="bento-chat-box" style="flex:1; overflow-y:auto; max-height: calc(100vh - 350px);">
      <h3>// LOCAL_NODES</h3>
      <div id="sidebarProducts">
        <div class="spinner"></div>
      </div>
    </div>

  </aside>

</div>

<script src="js/chat_v2.js"></script>
</body>
</html>
